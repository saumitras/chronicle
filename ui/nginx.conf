server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to gateway
    location /api/ {
        proxy_pass http://gateway:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SSE stream - disable buffering
    location /stream {
        proxy_pass http://gateway:8000/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # Alert generator API
    location /alert-api/ {
        proxy_pass http://alert-generator:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Temporal UI
    location /temporal {
        return 301 /temporal/;
    }
    location /temporal/ {
        proxy_pass http://temporal-ui:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets: never fall back to index.html — a missing asset
    # must 404, not return HTML with a JS MIME error. Hashes change per
    # build, so cache them forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback. index.html must revalidate on every load so a new
    # deploy's asset hashes are picked up immediately.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
